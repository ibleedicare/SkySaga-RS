[package]
name = "skysaga-datapc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "skysaga-extract-data"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }

# miniz_oxide backend: pure Rust, no C to build. The archive's members are plain zlib
# streams, so this is the whole of the decompression need.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints.rust]
unsafe_code = "forbid"
