[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
skysaga-core = { path = "crates/skysaga-core" }
skysaga-state = { path = "crates/skysaga-state" }
skysaga-auth = { path = "crates/skysaga-auth" }
skysaga-web = { path = "crates/skysaga-web" }
skysaga-proto = { path = "crates/skysaga-proto" }

anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
