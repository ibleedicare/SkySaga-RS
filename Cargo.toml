[workspace]
resolver = "2"
members = ["crates/*"]

# Its own workspace: it pulls in eframe, and the server's test suite should not have to
# build a GUI stack to run.
exclude = ["launcher"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
skysaga-core = { path = "crates/skysaga-core" }
skysaga-state = { path = "crates/skysaga-state" }
skysaga-auth = { path = "crates/skysaga-auth" }
skysaga-web = { path = "crates/skysaga-web" }
skysaga-proto = { path = "crates/skysaga-proto" }
raknet-sys = { path = "crates/raknet-sys" }
raknet = { path = "crates/raknet" }
skysaga-game = { path = "crates/skysaga-game" }
skysaga-world = { path = "crates/skysaga-world" }
skysaga-store = { path = "crates/skysaga-store" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[profile.release]
lto = "thin"
