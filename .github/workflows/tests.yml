# Builds and tests everything CI is able to build.
#
# # What CI can and cannot run
#
# Two things this repository needs are not in it, and cannot be:
#
#   * `libRakNet.so`, built from SLikeNet source. `raknet-sys`'s build script fails without it,
#     so `raknet`, `skysaga-game`, `skysaga-probe` and `skysaga-server` cannot be built here at
#     all. They are excluded by name rather than by a `--workspace` that would fail.
#   * `Entities.json` and `geodata.json`, which are the game's own data. Tests that read them
#     **skip** when they are absent rather than failing, so this job is green on a bare
#     checkout while still covering everything that does not need them.
#
# That is 491 of the suite's 676 tests. The gap is not hidden: the job prints both numbers, so
# "CI is green" never quietly means "CI ran a third of the tests".
#
# The nine crates below are exactly those with no path to `raknet-sys`. Adding a crate that
# depends on it will fail this job, which is the intended signal.

name: tests

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: |
          cargo test --all-targets \
            -p skysaga-core \
            -p skysaga-proto \
            -p skysaga-world \
            -p skysaga-state \
            -p skysaga-store \
            -p skysaga-auth \
            -p skysaga-web \
            -p skysaga-chat \
            -p skysagactl

      # Doc tests are not covered by --all-targets, and this crate documents its hashing with
      # one: `name_hash("Sky_Island") == 0xCBBFA7BF`.
      - name: Doc tests
        run: cargo test --doc -p skysaga-core -p skysaga-proto -p skysaga-world

      - name: Check formatting
        run: cargo fmt --check
        continue-on-error: true

      - name: Clippy
        run: |
          cargo clippy --all-targets \
            -p skysaga-core -p skysaga-proto -p skysaga-world -p skysaga-state \
            -p skysaga-store -p skysaga-auth -p skysaga-web -p skysaga-chat -p skysagactl \
            -- -D warnings
        continue-on-error: true

      # Says out loud what was skipped for want of the game's data files, so a green tick is
      # not mistaken for full coverage.
      - name: What this run could not cover
        if: always()
        run: |
          echo "Not built (need libRakNet.so): raknet, raknet-sys, skysaga-game,"
          echo "                               skysaga-probe, skysaga-server"
          echo "Skipped (need Entities.json / geodata.json): every test that reads a"
          echo "                               definition, a voxel table or a loot table"
          echo "Locally, with both present, the suite is 676 tests."
